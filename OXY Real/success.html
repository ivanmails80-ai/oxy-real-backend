<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Completato - OXY Real</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --oxy-gold: #c5a059; 
            --oxy-bg-dark: #002b4d;
            --oxy-bg-darker: #0a0a0a;
            --oxy-text-primary: #ffffff;
            --oxy-text-secondary: #b0b0c0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--oxy-bg-dark);
            color: var(--oxy-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 20px;
            padding: 50px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: var(--oxy-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--oxy-bg-darker);
            font-weight: bold;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 15px;
            color: var(--oxy-gold);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 16px;
            line-height: 1.8;
            color: var(--oxy-text-secondary);
            margin-bottom: 20px;
            font-weight: 300;
        }
        .button {
            display: inline-block;
            padding: 14px 35px;
            background: var(--oxy-gold);
            color: var(--oxy-bg-darker);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .button:hover {
            background: rgba(197, 160, 89, 0.9);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(197, 160, 89, 0.4);
        }
        .info {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(197, 160, 89, 0.2);
            font-size: 14px;
            color: var(--oxy-text-secondary);
        }
        .info a {
            color: var(--oxy-gold);
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>Pagamento Completato!</h1>
        <p>
            Grazie per il tuo acquisto. Il tuo abbonamento OXY Real è stato attivato con successo.
        </p>
        <p>
            Puoi tornare all'app e iniziare a utilizzare tutte le funzionalità del tuo piano.
        </p>
        <a href="oxyreal://success" class="button">Torna all'App</a>
        <div class="info">
            Se hai domande o bisogno di assistenza, contattaci a <a href="mailto:oxy@oxyreal.it">oxy@oxyreal.it</a>
        </div>
    </div>
</body>
</html>
