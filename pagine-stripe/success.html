<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento Completato - OXY Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #c5a059;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #d1d1d1;
            margin-bottom: 30px;
        }
        .button {
            display: inline-block;
            padding: 14px 30px;
            background: #c5a059;
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #d4b068;
        }
        .info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>Pagamento Completato!</h1>
        <p>
            Grazie per il tuo acquisto. Il tuo abbonamento OXY Real è stato attivato con successo.
        </p>
        <p>
            Puoi tornare all'app e iniziare a utilizzare tutte le funzionalità del tuo piano.
        </p>
        <a href="oxyreal://success" class="button">Torna all'App</a>
        <div class="info">
            Se hai domande o bisogno di assistenza, contattaci a <a href="mailto:oxy@oxyreal.it" style="color: #c5a059;">oxy@oxyreal.it</a>
        </div>
    </div>
</body>
</html>
